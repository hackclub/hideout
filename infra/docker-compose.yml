services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hideout
      POSTGRES_PASSWORD: hideout
      POSTGRES_DB: hideout
    ports:
      - '127.0.0.1:5436:5432'
    volumes:
      - hideout-db:/var/lib/postgresql/data
volumes:
  hideout-db:
